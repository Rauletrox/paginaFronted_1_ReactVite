<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resumen de compra y pago de Una U pa Delante Store.">
    <title>Pago - Una U Pa Delante Store</title>
    <link rel="icon" type="image/png" href="assets/img/logos_tienda/RAUL.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Navegación de pago">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="./">
                <img src="assets/img/logos_tienda/LOGO-ALTA-UNA-U.png" alt="Logo de Una U pa Delante" width="56" height="40" class="object-fit-contain">
                <span>Una U pa Delante</span>
            </a>
            <a class="btn btn-outline-info" href="./#productos">Volver a la tienda</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row g-4">
            <section class="col-lg-7" aria-labelledby="titulo-detalle">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 id="titulo-detalle" class="h3 mb-3">Detalle de la compra</h1>
                        <div id="mensaje-carrito" class="alert alert-info" role="status">Cargando detalle...</div>
                        <ul id="detalle-compra" class="list-group mb-3"></ul>
                        <div class="d-flex justify-content-between fs-5 fw-bold">
                            <span>Total a pagar</span>
                            <span id="total-pago">$0</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-lg-5" aria-labelledby="titulo-pago">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 id="titulo-pago" class="h4 mb-3">Metodo de pago</h2>
                        <form id="form-pago">
                            <fieldset class="mb-4">
                                <legend class="h6">Selecciona una opcion</legend>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="metodoPago" id="debito" value="tarjeta de debito" checked>
                                    <label class="form-check-label" for="debito">Tarjeta de debito</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="metodoPago" id="credito" value="tarjeta de credito">
                                    <label class="form-check-label" for="credito">Tarjeta de credito</label>
                                </div>
                            </fieldset>

                            <button id="btn-pagar" class="btn btn-success w-100" type="submit">Pagar</button>
                        </form>
                        <div id="mensaje-pago" class="alert alert-success mt-3 d-none" role="status"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Una U pa Delante. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
